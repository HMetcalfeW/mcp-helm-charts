{{- if eq .Values.mode "supergateway" }}
{{- $command := required "command is required in supergateway mode — set to the stdio MCP server command (e.g., 'uvx mcp-server-fetch')" .Values.command -}}
{{- end }}
{{- if eq .Values.mode "native" }}
{{- if not .Values.nativeCommand }}
{{- fail "nativeCommand is required in native mode — set to the container command (e.g., [\"mcp\", \"run\"])" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-server.fullname" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $annotations := dict }}
      {{- if .Values.env }}
      {{- $_ := set $annotations "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum) }}
      {{- end }}
      {{- if and .Values.secrets (not .Values.existingSecret) }}
      {{- $_ := set $annotations "checksum/secret" (include (print $.Template.BasePath "/secret.yaml") . | sha256sum) }}
      {{- end }}
      {{- with .Values.podAnnotations }}
      {{- range $k, $v := . }}
      {{- $_ := set $annotations $k $v }}
      {{- end }}
      {{- end }}
      {{- if $annotations }}
      annotations:
        {{- toYaml $annotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mcp-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "mcp-server.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq .Values.mode "supergateway" }}
          args:
            - "--stdio"
            - {{ .Values.command | quote }}
            - "--port"
            - {{ .Values.server.port | quote }}
            - "--outputTransport"
            - {{ .Values.server.transport | quote }}
            - "--healthEndpoint"
            - {{ .Values.server.healthEndpoint | quote }}
            {{- with .Values.server.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else }}
          command:
            {{- toYaml .Values.nativeCommand | nindent 12 }}
          {{- with .Values.nativeArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          {{- if or .Values.env .Values.secrets .Values.existingSecret }}
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ include "mcp-server.fullname" . }}-config
            {{- end }}
            {{- if or .Values.secrets .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret | default (printf "%s-secrets" (include "mcp-server.fullname" .)) }}
            {{- end }}
          {{- end }}
          startupProbe:
            {{- toYaml (omit .Values.startupProbe "httpGet" "tcpSocket" "grpc" "exec") | nindent 12 }}
            {{- if .Values.startupProbe.tcpSocket }}
            tcpSocket: {{- toYaml .Values.startupProbe.tcpSocket | nindent 14 }}
            {{- else if .Values.startupProbe.exec }}
            exec: {{- toYaml .Values.startupProbe.exec | nindent 14 }}
            {{- else if .Values.startupProbe.grpc }}
            grpc: {{- toYaml .Values.startupProbe.grpc | nindent 14 }}
            {{- else }}
            httpGet: {{- toYaml .Values.startupProbe.httpGet | nindent 14 }}
            {{- end }}
          livenessProbe:
            {{- toYaml (omit .Values.livenessProbe "httpGet" "tcpSocket" "grpc" "exec") | nindent 12 }}
            {{- if .Values.livenessProbe.tcpSocket }}
            tcpSocket: {{- toYaml .Values.livenessProbe.tcpSocket | nindent 14 }}
            {{- else if .Values.livenessProbe.exec }}
            exec: {{- toYaml .Values.livenessProbe.exec | nindent 14 }}
            {{- else if .Values.livenessProbe.grpc }}
            grpc: {{- toYaml .Values.livenessProbe.grpc | nindent 14 }}
            {{- else }}
            httpGet: {{- toYaml .Values.livenessProbe.httpGet | nindent 14 }}
            {{- end }}
          readinessProbe:
            {{- toYaml (omit .Values.readinessProbe "httpGet" "tcpSocket" "grpc" "exec") | nindent 12 }}
            {{- if .Values.readinessProbe.tcpSocket }}
            tcpSocket: {{- toYaml .Values.readinessProbe.tcpSocket | nindent 14 }}
            {{- else if .Values.readinessProbe.exec }}
            exec: {{- toYaml .Values.readinessProbe.exec | nindent 14 }}
            {{- else if .Values.readinessProbe.grpc }}
            grpc: {{- toYaml .Values.readinessProbe.grpc | nindent 14 }}
            {{- else }}
            httpGet: {{- toYaml .Values.readinessProbe.httpGet | nindent 14 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            {{- if eq .Values.mode "supergateway" }}
            medium: Memory
            sizeLimit: 512Mi
            {{- else }}
            sizeLimit: 128Mi
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
