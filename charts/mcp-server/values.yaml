# ── Deployment Mode ────────────────────────────────────────────────────────────
# "supergateway" — wraps a stdio MCP server command via supergateway (default).
# "native"       — runs the container directly; the server speaks HTTP natively
#                  (FastMCP, Go SDK, etc). No supergateway wrapper.
mode: supergateway

# ── Supergateway Mode ─────────────────────────────────────────────────────────
# The stdio command that supergateway wraps and exposes over HTTP.
# Required when mode=supergateway, ignored in native mode.
#
# Examples:
#   command: "uvx mcp-server-fetch"
#   command: "uvx awslabs.aws-documentation-mcp-server@latest"
#   command: "npx -y @modelcontextprotocol/server-github"
#   command: "npx -y @anthropic/mcp-server-fetch"
command: ""

# ── Native Mode ───────────────────────────────────────────────────────────────
# Container command and args for native HTTP MCP servers.
# Ignored in supergateway mode.
#
# Examples:
#   nativeCommand: ["mcp"]
#   nativeArgs: ["run", "awslabs.aws_documentation_mcp_server.server_aws:mcp",
#                "--transport", "streamable-http", "--port", "8000"]
#
#   nativeCommand: ["python", "-m"]
#   nativeArgs: ["my_mcp_server", "--host", "0.0.0.0", "--port", "8000"]
nativeCommand: []
nativeArgs: []

# ── Image ──────────────────────────────────────────────────────────────────────
# Supergateway mode: defaults to supercorp/supergateway.
# Native mode: override with your server image (e.g., python:3.12-slim).
image:
  repository: supercorp/supergateway
  tag: "3.4.1-uvx"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ── Transport ──────────────────────────────────────────────────────────────────
server:
  # Transport protocol (supergateway mode only): streamableHttp or sse
  transport: streamableHttp
  port: 8000
  # Health check endpoint path. Supergateway exposes /health automatically.
  # Native servers may use a different path (e.g., /healthz, /ready).
  healthEndpoint: /health
  # Extra CLI flags passed to supergateway (supergateway mode only).
  extraArgs: []

# ── Replica / Scaling ──────────────────────────────────────────────────────────
replicaCount: 1

# ── Resources ──────────────────────────────────────────────────────────────────
# Note: stdio MCP servers wrapped by supergateway (especially Python/uvx-based)
# can leak memory over time. Set limits appropriately for your server.
# AWS docs MCP: recommend limits.memory=2Gi with the OOMKill restart as a safety net.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# ── Service ────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8000

# ── Environment Variables ──────────────────────────────────────────────────────
# Non-sensitive environment variables injected into the container.
# Use for server configuration flags, API endpoints, feature toggles, etc.
env: {}
# env:
#   SOME_CONFIG: "value"

# ── Secrets ────────────────────────────────────────────────────────────────────
# Sensitive values injected as env vars from a k8s Secret.
# Values are base64-encoded automatically by the template.
# NEVER commit real credentials here — use --set at deploy time.
secrets: {}
# secrets:
#   API_TOKEN: ""
#   SOME_SECRET: ""

# Alternatively, reference an existing k8s Secret instead of creating one.
# When set, the chart does not create a Secret resource.
existingSecret: ""

# ── Probes ─────────────────────────────────────────────────────────────────────
startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 30
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

# ── Service Account ────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── Pod ────────────────────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

terminationGracePeriodSeconds: 15

# ── Scheduling ─────────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
